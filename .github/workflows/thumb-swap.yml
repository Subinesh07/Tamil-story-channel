name: Thumbnail swap

# Daily: a video 2-7 days old with under half our average views gets one new thumbnail
# (different story picture + layout, no AI pictures).
on:
  schedule:
    - cron: "53 7 * * *"   # 1:23 PM IST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libraqm0
          pip install -r requirements.txt
      - name: Restore saved pictures
        uses: actions/cache/restore@v5
        with:
          path: cache/images
          key: leda-none
          restore-keys: leda-
      - name: Check and swap
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/thumb_swap.py
      - name: Save
        run: |
          git config user.name "nila-bot"; git config user.email "bot@users.noreply.github.com"
          git add stories.csv status/
          git diff --cached --quiet || (git commit -m "Thumbnail swap [skip ci]" && (git push || (git pull --rebase -X theirs && git push)))
