name: Redo thumbnail

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Story id whose YouTube thumbnail should be made again"
        required: true

jobs:
  thumb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libraqm0
          pip install -r requirements.txt
      - name: Restore saved pictures
        uses: actions/cache/restore@v5
        with:
          path: |
            cache/tts
            cache/images
          key: leda-none
          restore-keys: leda-
      - name: Make and set thumbnail
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: cd src && python redo_thumbnail.py "${{ inputs.row_id }}"
      - uses: actions/upload-artifact@v5
        with:
          name: thumbnail-${{ inputs.row_id }}
          path: output/*.jpg
