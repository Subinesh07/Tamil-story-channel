name: Language check (which language is spoken)
on:
  workflow_dispatch:
    inputs:
      file:
        description: "Release asset to check, e.g. story_20.mp4"
        required: true
      zoom:
        description: "Optional: start end seconds to zoom into, e.g. 210 270"
        required: false
        default: ""
      run:
        description: "Optional: take the file from this run's saved video (run id)"
        required: false
        default: ""
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && pip install -q faster-whisper numpy
      - run: |
          if [ -n "${{ inputs.run }}" ]; then
            gh run download "${{ inputs.run }}" -D art && cp art/*/"${{ inputs.file }}" .
          else
            gh release download videos -p "${{ inputs.file }}" --clobber
          fi
          python src/langcheck.py "${{ inputs.file }}" ${{ inputs.zoom || '20' }}
        env:
          GH_TOKEN: ${{ github.token }}
