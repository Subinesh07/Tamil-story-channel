name: Competitor report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"   # every Monday 09:00 IST

permissions:
  contents: write
  issues: write

concurrency:
  group: stories-csv
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyse competitors
        id: rep
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: echo "path=$(python src/competitors.py | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Save report and notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || { git commit -m "Weekly competitor report [skip ci]"; git pull --rebase; git push; }
          gh issue create --title "📊 Weekly competitor report ($(date +%d-%b))" --body-file "${{ steps.rep.outputs.path }}"
