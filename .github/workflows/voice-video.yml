name: Viewers Corner video

# Started by the recording page: builds the video from the recordings and uploads it PRIVATE for approval.
on:
  workflow_dispatch:
    inputs:
      episode:
        description: "Viewers' Corner number"
        required: true
      blobs:
        description: "Recording blob ids, comma separated (sent by the recording page)"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: voice-video
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libraqm0
      - run: pip install -r requirements.txt
      - name: Build and upload (private)
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/voice_video.py "${{ inputs.episode }}" "${{ inputs.blobs }}"
      - name: Save and notify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "nila-bot"; git config user.email "bot@users.noreply.github.com"
          if [ -f status/voice_review.md ]; then
            gh issue create --title "🎙️ Viewers' Corner #${{ inputs.episode }} is ready – please review" --body-file status/voice_review.md
            rm status/voice_review.md
          fi
          git add -A voice/
          git diff --cached --quiet || (git commit -m "Viewers Corner #${{ inputs.episode }} made [skip ci]" && (git push || (git pull --rebase -X theirs && git push)))
