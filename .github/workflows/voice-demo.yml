name: Voice demo

# Reads one Tamil paragraph in several voices and saves the clips to voice_demos/ to compare.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Make voice demos
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python src/voice_demo.py
      - name: Save demos to the repo
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add voice_demos/
          git diff --cached --quiet || { git commit -m "Voice demos [skip ci]"; git pull --rebase; git push; }
