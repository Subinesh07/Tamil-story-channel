name: Rewrite stories (new style)

on:
  workflow_dispatch:
    inputs:
      rows:
        description: "Row ids, comma-separated (e.g. 7,5,10)"
        required: true
      mode:
        description: "redo = rewrite in the new style; logic = logic check and fix only"
        required: false
        default: "redo"

permissions:
  contents: write

concurrency:
  group: stories-csv
  cancel-in-progress: false

jobs:
  rewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rewrite
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_ORDER: ${{ vars.LLM_ORDER }}
        run: python src/generate_stories.py --${{ inputs.mode || 'redo' }} "${{ inputs.rows }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add stories.csv status/
          git diff --cached --quiet && exit 0
          git commit -m "Rewrite stories in the new style [skip ci]"
          git pull --rebase
          git push
