name: Produce video

on:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Story id to produce (blank = next pending story)"
        required: false
        default: ""
      fresh_pictures:
        description: "true = redo every picture of this story (voice is reused)"
        required: false
        default: "false"
      retry_failed:
        description: "true = give scenes that failed both tries ONE more round (only when the owner agrees)"
        required: false
        default: "false"
      no_check:
        description: "true = use new pictures WITHOUT the picture checker (owner's choice, one run)"
        required: false
        default: "false"
      hold:
        description: "true = upload privately WITHOUT a schedule; it waits for approval (Approve video workflow)"
        required: false
        default: "false"
      short_for:
        description: "Make and upload only the Shorts trailer for this uploaded story id"
        required: false
        default: ""
      upload:
        description: "Upload to YouTube"
        type: boolean
        default: true
  schedule:
    # every 6 hours (GitHub can delay schedules by hours). Each run makes the next story that is
    # due within 3 days and uploads it already scheduled for its 19:00 IST slot.
    - cron: "25 * * * *"   # hourly: exits in seconds when nothing is due; picks up as soon as free limits reset

permissions:
  contents: write
  issues: write

concurrency:
  group: stories-csv          # never two jobs editing stories.csv at once
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg and Tamil fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-unhinted libraqm0
          fc-list | grep -i "Noto Sans Tamil" | head -2

      - name: Install Python packages
        run: pip install -r requirements.txt faster-whisper
      - name: Whisper model (for the English-speech check)
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1

      - name: Restore saved Leda voice parts
        uses: actions/cache@v5
        with:
          path: |
            cache/tts
            cache/images
          key: leda-${{ github.run_id }}
          restore-keys: leda-

      - name: Sample test (must pass before any API use)
        run: python tests/test_sample.py

      - name: Make video
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          CF_ACCOUNT_ID_2: ${{ secrets.CF_ACCOUNT_ID_2 }}
          CF_API_TOKEN_2: ${{ secrets.CF_API_TOKEN_2 }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          VOICE_API_KEY: ${{ secrets.VOICE_API_KEY }}
          VOICE_API_KEY_2: ${{ secrets.VOICE_API_KEY_2 }}
          CHECK_API_KEY: ${{ secrets.CHECK_API_KEY }}
          CHECK_API_KEY_2: ${{ secrets.CHECK_API_KEY_2 }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.row_id }}" ]; then ARGS="--row-id ${{ inputs.row_id }}"; fi
          if [ -n "${{ inputs.short_for }}" ]; then ARGS="--short-for ${{ inputs.short_for }}"; fi
          if [ "${{ inputs.upload }}" = "false" ]; then ARGS="$ARGS --no-upload"; fi
          if [ "${{ inputs.fresh_pictures }}" = "true" ]; then export FRESH_PICTURES=1; fi
          if [ "${{ inputs.hold }}" = "true" ]; then export HOLD_FOR_APPROVAL=1; fi
          if [ "${{ inputs.retry_failed }}" = "true" ]; then export RETRY_FAILED=1; fi
          if [ "${{ inputs.no_check }}" = "true" ]; then export NO_PICTURE_CHECK=1; fi
          python src/make_video.py $ARGS

      - name: Keep the finished video for full-series compilations
        if: success() && inputs.short_for == ''

        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view videos >/dev/null 2>&1 || gh release create videos --title "Finished videos (for compilations)" --notes "Kept automatically. Do not delete."
          for f in output/story_*.mp4 output/story_*_thumbnail*.jpg; do
            [ -f "$f" ] || continue
            case "$f" in *_short*) continue;; esac
            gh release upload videos "$f" --clobber || echo "could not keep $f"
          done
          # 4 story pictures per video, for the automatic thumbnail swap
          for f in output/story_*.mp4; do
            case "$f" in *_short*) continue;; esac
            id=$(basename "$f" .mp4 | sed 's/story_//')
            pics=$(ls cache/images/row_$id/*.png 2>/dev/null | sort)
            n=$(echo "$pics" | grep -c . || true)
            [ "$n" -gt 0 ] || continue
            k=1
            for i in $(seq 1 4); do
              p=$(echo "$pics" | sed -n "$(( (n * i) / 5 + 1 ))p")
              [ -n "$p" ] && cp "$p" "row${id}_pic$k.png" && gh release upload videos "row${id}_pic$k.png" --clobber && k=$((k+1))
            done
          done

      - name: Community post draft -> GitHub issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f output/community_post.md ]; then
            gh issue create --title "📣 Community post for today's video ($(date +%d-%b))" \
              --body-file output/community_post.md --label community-post 2>/dev/null \
            || gh issue create --title "📣 Community post for today's video ($(date +%d-%b))" \
              --body-file output/community_post.md
          fi

      - name: Update schedule page
        if: always()
        run: python src/schedule.py

      - name: Save video, timings and log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: video-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.json
            output/*.png
            output/run.log
          retention-days: 7
          if-no-files-found: warn

      - name: Commit updated stories.csv
        if: always()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add stories.csv SCHEDULE.md status/
          if [ -f playlists.json ]; then git add playlists.json; fi
          git diff --cached --quiet && exit 0
          git commit -m "Update story status [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && break
            sleep 10
          done
