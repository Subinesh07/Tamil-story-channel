name: Facebook Reel (manual)

# Posts the Shorts of an already-made story as Facebook Reels (from the run's saved files).
# Scheduled ones keep their YouTube time; ones already public on YouTube are posted now.
on:
  workflow_dispatch:
    inputs:
      row_id:
        description: "Story id"
        required: true

jobs:
  reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Download the story's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p output
          # newest saved run files (artifact names are run numbers) that contain this story's Shorts
          for id in $(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=60" -q '.artifacts | sort_by(.created_at) | reverse | .[] | select(.expired==false and (.name|startswith("video-")) and .size_in_bytes > 1000000) | .id'); do
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > a.zip && unzip -o -q a.zip -d tmp
            if ls tmp/story_${{ inputs.row_id }}_short*.mp4 >/dev/null 2>&1; then cp tmp/story_${{ inputs.row_id }}_short*.mp4 output/; break; fi
            rm -rf tmp a.zip
          done
          ls output
      - name: Post Reels
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python src/fb_backfill.py ${{ inputs.row_id }}
