name: Style preview

# Same 2 scenes in 3 candidate art styles -> previews/styles/
on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Which samples (blank = standard, doomsday = Doomsday series)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libraqm0
      - run: pip install -r requirements.txt
      - name: Make previews
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          SAMPLE: ${{ inputs.sample }}
        run: cd src && python style_preview.py
      - name: Save previews
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add previews/
          git diff --cached --quiet || { git commit -m "Style previews [skip ci]"; git pull --rebase; git push; }
