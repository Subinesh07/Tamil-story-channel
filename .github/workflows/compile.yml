name: Full-series compilations

# Every day: when all parts of a series are public, join them into one full-story video
# (no voice or picture credits) and schedule it for 3 PM IST the next day.
on:
  schedule:
    - cron: "17 5 * * *"   # 10:47 AM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compile
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: pip install -r requirements.txt
      - name: Compile finished series
        env:
          GH_TOKEN: ${{ github.token }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: python src/compile_series.py
      - name: Save
        run: |
          git config user.name "nila-bot"; git config user.email "bot@users.noreply.github.com"
          git add series.json status/ ; [ -f playlists.json ] && git add playlists.json || true
          git diff --cached --quiet || (git commit -m "Compilation uploaded [skip ci]" && (git push || (git pull --rebase -X theirs && git push)))
