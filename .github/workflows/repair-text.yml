name: Repair story text

# Fixes stray Hindi / Malayalam / Korean ... letters in pending stories (runs only when started).
on:
  workflow_dispatch:
    inputs:
      spoken_rows:
        description: "Row ids whose bookish lines should be rewritten in spoken style (e.g. 5,7)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: stories-csv
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Repair
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          LLM_ORDER: ${{ vars.LLM_ORDER }}
          SPOKEN_ROWS: ${{ inputs.spoken_rows }}
        run: cd src && python text_fix.py
      - name: Commit
        if: always()
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add stories.csv
          git diff --cached --quiet && exit 0
          git commit -m "Repair story text [skip ci]"
          git pull --rebase
          git push
