name: Playlist covers

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libraqm0
          pip install -r requirements.txt
      - name: Restore saved story pictures
        uses: actions/cache/restore@v5
        with:
          path: |
            cache/tts
            cache/images
          key: leda-none
          restore-keys: leda-
      - run: cd src && python playlist_covers.py
      - name: Commit covers
        run: |
          git config user.name "story-bot"
          git config user.email "story-bot@users.noreply.github.com"
          git add previews/covers
          git diff --cached --quiet && exit 0
          git commit -m "Playlist covers [skip ci]"
          git pull --rebase && git push
